name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_evals:
        description: "Run plugin evals (calls the model; needs ANTHROPIC_API_KEY)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git identity for commit-hook tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Process definition, plugins and docs are in sync
        run: python tools/check_consistency.py

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and every plugin (strict)
        run: |
          claude plugin validate --strict .
          for p in plugins/*/; do claude plugin validate --strict "$p"; done

  evals:
    if: github.event_name == 'workflow_dispatch' && inputs.run_evals
    needs: [tests, validate]
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run evals for every plugin that has them
        run: |
          for p in plugins/*/; do
            if [ -d "$p/evals" ]; then
              claude plugin eval "$p" --trust-plugin --no-publish --runs 3 --threshold 0.8 --max-cost-usd 5
            fi
          done
